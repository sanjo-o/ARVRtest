<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Experience — View 3D Object</title>
  <meta name="description" content="Point your camera at the Hiro marker to see a 3D holographic crystal in augmented reality.">

  <!-- A-Frame & AR.js loaded normally in head (this is the standard way) -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    body { margin: 0; overflow: hidden; font-family: 'Inter', -apple-system, sans-serif; }
    .a-enter-vr, .a-orientation-modal { display: none !important; }

    .ar-top-bar {
      position: fixed; top: 0; left: 0; right: 0; padding: 16px 20px;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 9999; background: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent);
    }
    .ar-back-btn {
      display: flex; align-items: center; gap: 8px; padding: 10px 18px;
      background: rgba(0,0,0,0.5); backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 100px;
      color: #fff; font-size: 0.85rem; font-weight: 600; text-decoration: none;
      transition: all 0.3s ease;
    }
    .ar-back-btn:hover { background: rgba(139,92,246,0.4); }

    .ar-status {
      padding: 8px 16px; background: rgba(0,0,0,0.5); backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 100px;
      color: #fff; font-size: 0.75rem; font-weight: 500;
      display: flex; align-items: center; gap: 8px;
    }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%; background: #22C55E;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(0.8)} }

    .ar-bottom-hint {
      position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
      padding: 14px 28px; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 100px;
      color: #fff; font-size: 0.85rem; font-weight: 500; z-index: 9999;
      text-align: center; white-space: nowrap;
      animation: fadeUp 0.8s ease 1s both;
    }
    @keyframes fadeUp { from{opacity:0;transform:translateX(-50%) translateY(20px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }
  </style>
</head>
<body>

  <!-- AR UI Overlay -->
  <div class="ar-top-bar">
    <a href="index.html" class="ar-back-btn">← Back</a>
    <div class="ar-status">
      <span class="status-dot"></span>
      <span id="status-text">Camera Active</span>
    </div>
  </div>

  <div class="ar-bottom-hint" id="ar-hint">
    📷 Point your camera at the Hiro marker
  </div>

  <!-- Standard A-Frame AR Scene -->
  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
    renderer="logarithmicDepthBuffer: true; antialias: true; alpha: true;"
    vr-mode-ui="enabled: false"
  >
    <a-marker preset="hiro" id="hiro-marker" emitevents="true">

      <!-- Base Glow Ring -->
      <a-ring position="0 0.02 0" rotation="-90 0 0" radius-inner="0.25" radius-outer="0.55"
        material="color: #7C3AED; opacity: 0.25; side: double; transparent: true;"
        animation="property: scale; from: 0.9 0.9 0.9; to: 1.15 1.15 1.15; dir: alternate; loop: true; dur: 2000; easing: easeInOutSine"
      ></a-ring>

      <a-ring position="0 0.015 0" rotation="-90 0 0" radius-inner="0.15" radius-outer="0.2"
        material="color: #22D3EE; opacity: 0.3; side: double; transparent: true;"
        animation="property: scale; from: 1.1 1.1 1.1; to: 0.85 0.85 0.85; dir: alternate; loop: true; dur: 1500; easing: easeInOutSine"
      ></a-ring>

      <!-- Main Crystal (Diamond) -->
      <a-entity position="0 0.6 0"
        animation="property: position; from: 0 0.55 0; to: 0 0.75 0; dir: alternate; loop: true; dur: 2500; easing: easeInOutSine"
        animation__spin="property: rotation; from: 0 0 0; to: 0 360 0; loop: true; dur: 6000; easing: linear"
      >
        <!-- Top pyramid -->
        <a-cone position="0 0.1 0" radius-bottom="0.18" radius-top="0" height="0.32" segments-radial="6"
          material="color: #8B5CF6; metalness: 0.9; roughness: 0.1; opacity: 0.85; transparent: true;"></a-cone>
        <!-- Bottom pyramid -->
        <a-cone position="0 -0.08 0" radius-bottom="0" radius-top="0.18" height="0.22" segments-radial="6"
          material="color: #6D28D9; metalness: 0.9; roughness: 0.1; opacity: 0.85; transparent: true;"></a-cone>
        <!-- Inner glow -->
        <a-sphere position="0 0.02 0" radius="0.08"
          material="color: #C4B5FD; emissive: #8B5CF6; emissiveIntensity: 0.8; opacity: 0.6; transparent: true;"
          animation="property: scale; from: 0.8 0.8 0.8; to: 1.3 1.3 1.3; dir: alternate; loop: true; dur: 1500; easing: easeInOutSine"
        ></a-sphere>
      </a-entity>

      <!-- Orbiting Ring 1 -->
      <a-entity position="0 0.65 0"
        animation="property: position; from: 0 0.55 0; to: 0 0.75 0; dir: alternate; loop: true; dur: 2500; easing: easeInOutSine">
        <a-torus radius="0.32" radius-tubular="0.006" segments-radial="3" segments-tubular="64"
          material="color: #A78BFA; opacity: 0.6; transparent: true; emissive: #7C3AED; emissiveIntensity: 0.3;"
          rotation="25 0 15"
          animation="property: rotation; from: 25 0 15; to: 25 360 15; loop: true; dur: 4000; easing: linear"
        ></a-torus>
      </a-entity>

      <!-- Orbiting Ring 2 -->
      <a-entity position="0 0.65 0"
        animation="property: position; from: 0 0.55 0; to: 0 0.75 0; dir: alternate; loop: true; dur: 2500; easing: easeInOutSine">
        <a-torus radius="0.38" radius-tubular="0.004" segments-radial="3" segments-tubular="64"
          material="color: #22D3EE; opacity: 0.4; transparent: true; emissive: #06B6D4; emissiveIntensity: 0.3;"
          rotation="70 0 -20"
          animation="property: rotation; from: 70 0 -20; to: 70 -360 -20; loop: true; dur: 5000; easing: linear"
        ></a-torus>
      </a-entity>

      <!-- Orbiting Particles -->
      <a-entity position="0 0.65 0"
        animation="property: position; from: 0 0.55 0; to: 0 0.75 0; dir: alternate; loop: true; dur: 2500; easing: easeInOutSine">
        <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 3000; easing: linear">
          <a-sphere position="0.42 0 0" radius="0.022"
            material="color: #DDD6FE; emissive: #A78BFA; emissiveIntensity: 1; opacity: 0.9; transparent: true;"></a-sphere>
        </a-entity>
      </a-entity>

      <a-entity position="0 0.65 0"
        animation="property: position; from: 0 0.55 0; to: 0 0.75 0; dir: alternate; loop: true; dur: 2500; easing: easeInOutSine">
        <a-entity rotation="45 0 30"
          animation="property: rotation; from: 45 0 30; to: 45 -360 30; loop: true; dur: 4500; easing: linear">
          <a-sphere position="0.35 0 0" radius="0.016"
            material="color: #A5F3FC; emissive: #22D3EE; emissiveIntensity: 1; opacity: 0.8; transparent: true;"></a-sphere>
        </a-entity>
      </a-entity>

      <a-entity position="0 0.65 0"
        animation="property: position; from: 0 0.55 0; to: 0 0.75 0; dir: alternate; loop: true; dur: 2500; easing: easeInOutSine">
        <a-entity rotation="80 30 0"
          animation="property: rotation; from: 80 30 0; to: 80 390 0; loop: true; dur: 3800; easing: linear">
          <a-sphere position="0.3 0 0" radius="0.014"
            material="color: #FBCFE8; emissive: #EC4899; emissiveIntensity: 0.8; opacity: 0.7; transparent: true;"></a-sphere>
        </a-entity>
      </a-entity>

      <!-- Lighting -->
      <a-light type="point" position="0 0.8 0" color="#8B5CF6" intensity="1.0" distance="4"></a-light>
      <a-light type="point" position="0.3 0.5 0.3" color="#22D3EE" intensity="0.5" distance="3"></a-light>
      <a-light type="ambient" color="#ffffff" intensity="0.3"></a-light>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // Marker event handlers
    const marker = document.getElementById('hiro-marker');
    const statusText = document.getElementById('status-text');
    const hint = document.getElementById('ar-hint');

    marker.addEventListener('markerFound', () => {
      statusText.textContent = 'Marker Detected ✓';
      hint.style.display = 'none';
    });

    marker.addEventListener('markerLost', () => {
      statusText.textContent = 'Searching...';
      hint.style.display = 'block';
    });
  </script>

</body>
</html>
